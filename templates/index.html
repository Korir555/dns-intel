<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNS Intelligence</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Monaco,monospace;background:linear-gradient(135deg,#0a0e27,#1a1f3a);color:#00ff88;min-height:100vh;padding:20px}h1{font-size:2.5em;text-shadow:0 0 10px #00ff88;margin-bottom:20px}.container{max-width:1200px;margin:0 auto}.panel{background:rgba(15,23,42,.9);border:1px solid #00ff88;padding:30px;border-radius:5px;margin-bottom:30px}input{width:100%;padding:12px;border:1px solid #00ff88;background:rgba(0,30,60,.8);color:#00ff88;border-radius:3px;margin-bottom:15px}button{width:100%;padding:12px;background:#00ff88;color:#0a0e27;border:none;border-radius:3px;font-weight:bold;cursor:pointer;margin-bottom:10px}button:hover{background:#00ff44}.record{background:rgba(0,30,60,.8);border-left:3px solid #00ff88;padding:15px;margin:10px 0;border-radius:3px}h3{color:#00ff44;margin-bottom:10px}.status{padding:12px;border-radius:3px;margin:10px 0}</style></head><body><div class="container"><h1>🌐 DNS & CERTIFICATE INTELLIGENCE</h1><div class="panel"><label>Domain</label><input type="text" id="domain" placeholder="example.com"><button onclick="lookup()">LOOKUP DNS</button><button onclick="getCert()">GET CERTIFICATE</button></div><div id="results" class="panel" style="display:none"><div id="dnsRecords"></div><div id="certInfo"></div></div></div><script>const API='http://127.0.0.1:5004';function lookup(){const domain=document.getElementById('domain').value;if(!domain)return;fetch(API+'/api/dns/lookup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domain})}).then(r=>r.json()).then(data=>{let html='<h2 style="color:#00ff44;margin-bottom:15px">DNS Records for '+domain+'</h2>';for(let type in data.records){html+='<div class="record"><h3>'+type+'</h3>';data.records[type].forEach(rec=>{html+='<div>'+rec+'</div>'});html+='</div>'}document.getElementById('dnsRecords').innerHTML=html;document.getElementById('results').style.display='block'})}function getCert(){const domain=document.getElementById('domain').value;if(!domain)return;fetch(API+'/api/cert/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domain})}).then(r=>r.json()).then(data=>{let html='<h2 style="color:#00ff44;margin-bottom:15px;margin-top:30px">Certificate Info</h2>';html+='<div class="record"><strong>Issued to:</strong> '+data.domain+'<br><strong>Valid:</strong> '+data.not_before+' to '+data.not_after+'</div>';document.getElementById('certInfo').innerHTML=html;document.getElementById('results').style.display='block'}).catch(e=>alert('Error: '+e.message))}</script></body></html>
